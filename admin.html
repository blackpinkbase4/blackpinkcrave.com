<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - CRAVE</title>
  <link rel="stylesheet" href="style.css?v=54">
  <style>
    .admin-container {
      padding: 140px 24px 80px 24px;
      max-width: 800px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-color);
    }
    .form-group input, .form-group textarea, .form-group select {
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--card-bg);
      color: var(--text-color);
      font-family: var(--font-sans);
      font-size: 14px;
    }
    .form-group textarea {
      height: 150px;
      resize: vertical;
    }
    .publish-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    .publish-btn:hover {
      opacity: 0.9;
    }
    .article-manager {
      margin-top: 60px;
      border-top: 1px solid var(--border-color);
      padding-top: 40px;
    }
    .mgr-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 12px;
      background-color: var(--card-bg);
    }
    .delete-btn {
      background-color: #ff0000;
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 20px;
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
    }
    #loginWall {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .login-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .login-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin-bottom: 20px;
      box-sizing: border-box;
      font-family: var(--font-sans);
      font-size: 14px;
    }
    .login-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      width: 100%;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>
</head>
<body style="background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0;">

  <div id="loginWall">
    <div class="login-card">
      <h2 style="font-family: var(--font-brand); font-size: 20px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 24px;">Admin Authentication</h2>
      <input type="text" id="adminUsernameInput" class="login-input" placeholder="Username / Email">
      <input type="password" id="adminPasswordInput" class="login-input" placeholder="Password">
      <button onclick="attemptLogin()" class="login-btn">Unlock Portal</button>
      <div id="loginError" style="color: #ff0000; font-size: 12px; margin-top: 15px; font-family: var(--font-sans); display: none;"></div>
    </div>
  </div>

  <nav>
    <div class="nav-container">
      <div style="display: flex; align-items: center;">
        <a href="index.html" class="nav-back-link" style="text-decoration: none; color: var(--text-color); font-size: 18px; font-weight: bold; margin-right: 12px; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-color); background-color: var(--card-bg); transition: all 0.3s;" title="Go Back">←</a>
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;"><span>BLACKPINK</span> CRAVE</a></div>
      </div>
      <div style="display: flex; align-items: center; gap: 15px;">
        <button onclick="toggleTheme()" class="emoji-theme-btn" id="themeToggleBtn" title="Toggle Light/Dark Mode">☀️</button>
        <button class="hamburger-btn" onclick="toggleMobileMenu()" style="background: none; border: none; color: var(--text-color); font-size: 24px; cursor: pointer; padding: 0; line-height: 1; display: none;" title="Open Menu">☰</button>
      </div>
    </div>
  </nav>
  <div id="mobileMenu" style="display: none; position: fixed; top: 60px; left: 0; width: 100%; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); z-index: 2999; padding: 20px; box-sizing: border-box; flex-direction: column; gap: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: background-color var(--transition-speed), border-color var(--transition-speed);">
    <a href="index.html" style="font-family: var(--font-sans); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-color); text-decoration: none; transition: color var(--transition-speed);">Home</a>
    <a href="index.html#members-section" style="font-family: var(--font-sans); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-color); text-decoration: none; transition: color var(--transition-speed);">Members</a>
    <a href="index.html#news-section" style="font-family: var(--font-sans); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-color); text-decoration: none; transition: color var(--transition-speed);">Daily Updates</a>
    <a href="admin.html" style="font-family: var(--font-sans); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-color); text-decoration: none; transition: color var(--transition-speed);">Admin Portal</a>
  </div>

  <main class="admin-container">
    <h1 style="font-family: var(--font-brand); font-size: 32px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 40px;">News Manager</h1>
    
    <form id="newsForm">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. LISA for Vogue Korea">
      </div>
      <div class="form-group">
        <label for="imageFile">Cover Image (Upload File)</label>
        <input type="file" id="imageFile" accept="image/*">
        <input type="hidden" id="existingImage">
      </div>
      <div class="form-group">
        <label for="snippet">Short Snippet</label>
        <input type="text" id="snippet" placeholder="A brief sentence for the home feed card...">
      </div>
      <div class="form-group">
        <label for="content">Article Body</label>
        <textarea id="content" placeholder="Write the full news content here..."></textarea>
      </div>

      <div class="form-group">
        <label for="youtube">YouTube Video ID (Optional)</label>
        <input type="text" id="youtube" placeholder="e.g. dQw4w9WgXcQ (ID only, not full link)">
      </div>
      <div class="form-group">
        <label for="spotify">Spotify Embed Link (Optional)</label>
        <input type="text" id="spotify" placeholder="e.g. https://open.spotify.com/embed/track/...">
      </div>
      <div class="form-group">
        <label for="galleryFiles">Additional Images Gallery (Upload Multiple)</label>
        <input type="file" id="galleryFiles" accept="image/*" multiple>
        <input type="hidden" id="existingGallery">
      </div>
      <div class="form-group">
        <label for="cardType">Card Display Type</label>
        <select id="cardType">
          <option value="pic">Pic Card (Standard Image Cover)</option>
          <option value="video">Video Card (Live YouTube Video Cover)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="sourceName">Source / Article Name (Optional)</label>
        <input type="text" id="sourceName" placeholder="e.g. Koreaboo">
      </div>
      <div class="form-group">
        <label for="sourceUrl">Source / Article Link (Optional)</label>
        <input type="text" id="sourceUrl" placeholder="e.g. https://www.koreaboo.com/news/...">
      </div>
      <button type="submit" class="publish-btn">Publish Update</button>
    </form>

    <div class="article-manager">
      <h2 style="font-family: var(--font-brand); font-size: 20px; font-weight: 500; margin-bottom: 24px; text-transform: uppercase;">Published Articles</h2>
      <div id="articlesList"></div>
    </div>
  </main>

  <script src="script.js?v=6"></script>
  <script>
    const form = document.getElementById('newsForm');
    
    function checkAuth() {
      const token = sessionStorage.getItem('adminToken');
      if (token === 'crave_auth_token_2026') {
        document.getElementById('loginWall').style.display = 'none';
        loadArticles();
      } else {
        document.getElementById('loginWall').style.display = 'flex';
      }
    }

    window.addEventListener('load', () => {
      sessionStorage.removeItem('adminToken');
      checkAuth();
    });

    function extractYouTubeId(urlOrId) {
      if (!urlOrId) return "";
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = urlOrId.match(regExp);
      return (match && match[2].length === 11) ? match[2] : urlOrId;
    }

    function attemptLogin() {
      const username = document.getElementById('adminUsernameInput').value.trim();
      const password = document.getElementById('adminPasswordInput').value;
      const errorDiv = document.getElementById('loginError');
      errorDiv.style.display = 'none';

      if (username === 'blackpinkcrave' && password === 'adminblackpink4') {
        sessionStorage.setItem('adminToken', 'crave_auth_token_2026');
        checkAuth();
      } else {
        errorDiv.textContent = 'Incorrect Username / Email or Password';
        errorDiv.style.display = 'block';
      }
    }

    document.getElementById('adminUsernameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        attemptLogin();
      }
    });
    document.getElementById('adminPasswordInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        attemptLogin();
      }
    });

    let articlesData = [];
    let editingId = null;

    function loadArticles() {
      db.collection('news').orderBy('timestamp', 'desc').get()
        .then(snapshot => {
          articlesData = [];
          const list = document.getElementById('articlesList');
          list.innerHTML = '';
          snapshot.forEach(doc => {
            const art = doc.data();
            art.id = doc.id;
            articlesData.push(art);
            const div = document.createElement('div');
            div.className = 'mgr-item';
            div.innerHTML = `
              <div>
                <strong style="display:block; font-size:15px; color:var(--text-color);">${art.title}</strong>
                <span style="font-size:11px; color:var(--text-muted);">${art.date}</span>
              </div>
              <div style="display: flex; gap: 10px;">
                <button class="publish-btn" style="padding: 6px 16px; border-radius: 20px; font-size: 10px;" onclick="startEdit('${art.id}')">Edit</button>
                <button class="delete-btn" onclick="deleteArticle('${art.id}')">Delete</button>
              </div>
            `;
            list.appendChild(div);
          });
        })
        .catch(err => console.error(err));
    }

    function startEdit(id) {
      const art = articlesData.find(item => item.id === id);
      if (art) {
        editingId = id;
        document.getElementById('title').value = art.title || "";
        document.getElementById('existingImage').value = art.image || "";
        document.getElementById('snippet').value = art.snippet || "";
        document.getElementById('content').value = art.content || "";
        document.getElementById('youtube').value = art.youtube || "";
        document.getElementById('spotify').value = art.spotify || "";
        document.getElementById('existingGallery').value = art.gallery || "";
        document.getElementById('cardType').value = art.cardType || "pic";
        document.getElementById('sourceName').value = art.sourceName || "";
        document.getElementById('sourceUrl').value = art.sourceUrl || "";
        document.querySelector('.publish-btn').textContent = 'Update Article';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    async function uploadToImgBB(file) {
      const formData = new FormData();
      formData.append('image', file);
      const res = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbApiKey}`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if (data && data.data && data.data.url) {
        return data.data.url;
      } else {
        throw new Error(data.error ? data.error.message : 'ImgBB Upload failed');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const titleVal = document.getElementById('title').value.trim();
      const snippetVal = document.getElementById('snippet').value.trim();
      const contentVal = document.getElementById('content').value.trim();
      const youtubeVal = document.getElementById('youtube').value.trim();
      const spotifyVal = document.getElementById('spotify').value.trim();
      const mainFileInput = document.getElementById('imageFile');
      const existingImage = document.getElementById('existingImage').value.trim();
      const galleryFileInput = document.getElementById('galleryFiles');
      const existingGallery = document.getElementById('existingGallery').value.trim();

      const hasMainImage = (mainFileInput.files.length > 0 || existingImage !== "");
      const hasGallery = (galleryFileInput.files.length > 0 || existingGallery !== "");

      if (!titleVal && !snippetVal && !contentVal && !youtubeVal && !spotifyVal && !hasMainImage && !hasGallery) {
        alert("Please fill in at least one field before publishing.");
        return;
      }

      const btn = document.querySelector('.publish-btn');
      const originalBtnText = btn.textContent;
      btn.textContent = 'Uploading images and saving...';
      btn.disabled = true;

      try {
        const mainFileInput = document.getElementById('imageFile');
        let imageUrl = document.getElementById('existingImage').value || "";
        if (mainFileInput.files.length > 0) {
          const file = mainFileInput.files[0];
          imageUrl = await uploadToImgBB(file);
        }



        const galleryFileInput = document.getElementById('galleryFiles');
        let galleryUrls = document.getElementById('existingGallery').value || "";
        if (galleryFileInput.files.length > 0) {
          const urls = [];
          for (let i = 0; i < galleryFileInput.files.length; i++) {
            const file = galleryFileInput.files[i];
            const url = await uploadToImgBB(file);
            urls.push(url);
          }
          galleryUrls = urls.join(',');
        }

        const todayStr = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        const payload = {
          title: document.getElementById('title').value || "",
          image: imageUrl,
          snippet: document.getElementById('snippet').value || "",
          content: document.getElementById('content').value || "",
          author: "BLINK",
          youtube: extractYouTubeId(document.getElementById('youtube').value) || "",
          spotify: document.getElementById('spotify').value || "",
          gallery: galleryUrls,
          cardType: document.getElementById('cardType').value || "pic",
          sourceName: document.getElementById('sourceName').value || "",
          sourceUrl: document.getElementById('sourceUrl').value || "",
          date: todayStr,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (editingId) {
          await db.collection('news').doc(editingId).update(payload);
          editingId = null;
          btn.textContent = 'Publish Update';
        } else {
          await db.collection('news').add(payload);
        }
        form.reset();
        document.getElementById('existingImage').value = "";
        document.getElementById('existingGallery').value = "";
        document.getElementById('cardType').value = "pic";
        document.getElementById('sourceName').value = "";
        document.getElementById('sourceUrl').value = "";
        loadArticles();
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.textContent = 'Publish Update';
        btn.disabled = false;
      }
    });

    function deleteArticle(id) {
      if (confirm('Are you sure you want to delete this article?')) {
        db.collection('news').doc(id).delete()
          .then(() => {
            loadArticles();
          })
          .catch(err => alert('Error: ' + err.message));
      }
    }

    document.addEventListener('DOMContentLoaded', checkAuth);
      function toggleMobileMenu() {
      const menu = document.getElementById('mobileMenu');
      if (menu) {
        if (menu.style.display === 'flex') {
          menu.style.display = 'none';
        } else {
          menu.style.display = 'flex';
        }
      }
    }
  </script>
</body>
</html>
