  <script src="script.js?v=6"></script>
  <script>
    function handleLogout() {
      localStorage.removeItem('crave_premium_logged_in');
      sessionStorage.removeItem('premium_modal_dismissed');
      window.location.href = 'index.html';
    }


    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('premiumBgVideo');
      if (video) {

        video.loop = false;

        video.addEventListener('timeupdate', () => {
          if (video.duration && video.currentTime >= video.duration - 7) {
            video.currentTime = 0;
            video.play().catch(err => console.log('Video loop play interrupted:', err));
          }
        });


        video.addEventListener('ended', () => {
          video.currentTime = 0;
          video.play().catch(err => console.log('Video end play interrupted:', err));
        });
      }


      const menuToggle = document.getElementById('menuToggleBtn');
      const menuClose = document.getElementById('mobileMenuCloseBtn');
      const menuOverlay = document.getElementById('mobileMenuOverlay');
      const menuBackdrop = document.getElementById('mobileMenuBackdrop');

      if (menuToggle && menuOverlay && menuBackdrop) {
        menuToggle.addEventListener('click', () => {
          menuOverlay.style.right = '0';
          menuBackdrop.style.opacity = '1';
          menuBackdrop.style.pointerEvents = 'auto';
          document.body.style.overflow = 'hidden';
        });
      }

      const closeMenu = () => {
        if (menuOverlay && menuBackdrop) {
          menuOverlay.style.right = '-280px';
          menuBackdrop.style.opacity = '0';
          menuBackdrop.style.pointerEvents = 'none';
          document.body.style.overflow = 'auto';
        }
      };

      if (menuClose) menuClose.addEventListener('click', closeMenu);
      if (menuBackdrop) menuBackdrop.addEventListener('click', closeMenu);


      const userProfile = document.getElementById('userProfile');
      const mobileUserProfile = document.getElementById('mobileUserProfile');
      const userName = localStorage.getItem('crave_premium_user_name') || 'Premium User';
      const userAvatar = localStorage.getItem('crave_premium_user_avatar');

      const firstName = userName.split(' ')[0];

      let avatarHtml = `<div style="width: 28px; height: 28px; border-radius: 50%; background: #ff6f3c; color: #fff; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.1);">${userName.charAt(0)}</div>`;

      if (userAvatar) {
        avatarHtml = `<img src="${userAvatar}" alt="${userName}" style="width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); object-fit: cover;">`;
      }

      if (userProfile) {
        userProfile.innerHTML = `
          ${avatarHtml}
          <span style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.85); letter-spacing: 0.5px;">Welcome, <span style="color: #ff6f3c; font-weight: 700;">${firstName}</span>!</span>
        `;
      }
      if (mobileUserProfile) {
        mobileUserProfile.innerHTML = `
          ${avatarHtml}
          <span style="font-size: 12px; font-weight: 600; color: #fff; letter-spacing: 0.5px;">Welcome, ${firstName}!</span>
        `;
      }
    });
  </script>
